optuna_search:
  n_trials: 10
  direction: maximize
  cv: 3

model_selection:
  module_0:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      max_depth:
        - 10
        - 20
        - 30
      n_estimators:
        - 50
        - 100
        - 150

  module_1:
    class: GradientBoostingClassifier
    module: sklearn.ensemble
    params:
      learning_rate:
        - 0.01
        - 0.05
        - 0.1
      n_estimators:
        - 50
        - 100

  module_2:
    class: DecisionTreeClassifier
    module: sklearn.tree
    params:
      criterion:
        - gini
        - entropy
      max_depth:
        - 5
        - 10
        - 15

  module_3:
    class: XGBClassifier
    module: xgboost
    params:
      max_depth:
        - 3
        - 5
        - 8
      n_estimators:
        - 50
        - 100
